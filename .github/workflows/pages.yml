name: ドキュメント検証・GitHub Pages公開

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docusaurusの検証
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存を固定版で導入
        run: pnpm install --frozen-lockfile
      - name: 生成テスト・本番build・内部リンクを確認
        run: pnpm dev:ptest
      - name: Pages artifactを保存
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true

  deploy:
    name: GitHub Pagesへ公開
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages設定を確認
        uses: actions/configure-pages@v6
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v5
